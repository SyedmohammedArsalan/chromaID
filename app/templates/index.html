<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaID - Discover Your Season</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2d3748;
            --accent-dark: #1a202c;
            --border-light: #e2e8f0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #ffffff, transparent);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .upload-card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .upload-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-dark);
            margin: 0 0 10px 0;
        }
        .upload-card p {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent-dark);
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-dark);
        }
        input[type="file"] {
            padding: 10px;
            background: #f8f9fa;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            background: var(--accent-dark);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #2d3748;
            transform: translateY(-2px);
        }
        .submit-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }
        #loadingMessage {
            display: none;
            color: #718096;
            margin-top: 15px;
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="upload-card">
        <h1>ChromaID</h1>
        <p>Upload a clear photo of your face in natural lighting to discover your seasonal color palette.</p>
        <form id="uploadForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="e.g., Jane Doe" required>
            </div>
            <div class="form-group">
                <label for="photo">Upload Photo</label>
                <input type="file" id="photo" name="photo" accept="image/png, image/jpeg, image/jpg" required>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Analyze My Colors</button>
            <div id="loadingMessage">Analyzing your features... Please wait.</div>
        </form>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const loadingMessage = document.getElementById('loadingMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Processing...";
            loadingMessage.style.display = "block";

            const formData = new FormData(form);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Analysis failed');
                }
                const result = await response.json();
                window.location.href = `/color-report/${encodeURIComponent(result.name)}`;
            } catch (error) {
                alert("Error: " + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Analyze My Colors";
                loadingMessage.style.display = "none";
            }
        });
    </script>
</body>
</html>
